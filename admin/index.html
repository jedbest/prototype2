<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRONCITY ADMIN</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }
body { background:#000; color:#fff; padding:15px; }
h1 { color:#a6ff00; text-align:center; margin-top:10px; }
#loginBox { max-width:350px; margin:80px auto; background:#111; padding:25px; border-radius:16px; border:2px solid #a6ff00; text-align:center; }
#dashboard { display:none; }
.stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:20px 0; }
.card { background:#111; border:1px solid #333; padding:15px; border-radius:12px; text-align:center; }
.card b { color:#a6ff00; font-size:20px; display:block; margin-top:5px; }
input { width:100%; padding:12px; border-radius:8px; border:1px solid #333; background:#000; color:#fff; margin:10px 0; }
table { width:100%; border-collapse:collapse; background:#111; border-radius:12px; overflow:hidden; font-size:13px; }
th { background:#a6ff00; color:#000; padding:10px; text-align:left; }
td { padding:10px; border-bottom:1px solid #222; text-align:left; }
.active { color:#a6ff00; font-weight:800; }
.expiring { color:orange; font-weight:800; }
.expired { color:red; font-weight:800; }
.btn { border:none; padding:12px 20px; border-radius:8px; font-weight:900; cursor:pointer; width:100%; }
.btn-green { background:#a6ff00; color:#000; }
</style>
</head>
<body>

<div id="loginBox">
  <div style="color:#a6ff00; font-weight:900; font-size:20px;">🔒 ADMIN LOGIN</div>
  <div style="color:#666; font-size:12px; margin-bottom:15px;">IRONCITY GYM ONLY</div>
  <input type="password" id="passInput" placeholder="Enter Password">
  <button class="btn btn-green" onclick="checkPassword()">UNLOCK</button>
  <div id="loginError" style="color:red; font-size:13px; margin-top:10px;"></div>
</div>

<div id="dashboard">
  <div><h1>IRONCITY ADMIN</h1></div>
  <div style="text-align:center; color:#666; font-size:12px;">Behind Ogige Main Market <br><button onclick="logout()" style="width:auto; padding:4px 10px; background:#222; color:#fff; font-size:11px; margin-top:5px; border:none; border-radius:5px; cursor:pointer;">Logout</button></div>

  <div class="stats">
    <div class="card"><span>Total Members</span><b id="total">0</b></div>
    <div class="card"><span>🟢 Active</span><b id="active">0</b></div>
    <div class="card"><span>🔴 Expired</span><b id="expired">0</b></div>
  </div>
  <div class="stats">
    <div class="card"><span>💰 Revenue</span><b id="revenue">₦0</b></div>
    <div class="card"><span>🟡 Soon</span><b id="soon">0</b></div>
    <div class="card"><span>Today</span><b id="todayDate"></b></div>
  </div>

  <div><button class="btn btn-green" onclick="loadMembers()">🔄 Refresh Data</button></div>
  <div><input type="text" id="search" placeholder="Search by Name or Phone..." onkeyup="filterTable()"></div>

  <div style="overflow-x:auto;">
    <table>
      <thead><tr><th>Name</th><th>Phone</th><th>Plan</th><th>Expiry</th><th>Status</th></tr></thead>
      <tbody id="tableBody"><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "IronCity2024";
const SCRIPT_URL = "PUT_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE";

function checkPassword(){
  if(document.getElementById('passInput').value === ADMIN_PASSWORD){
    localStorage.setItem('ironcity_admin','true');
    showDashboard();
  } else {
    document.getElementById('loginError').innerText = "Wrong password!";
  }
}
function showDashboard(){
  document.getElementById('loginBox').style.display="none";
  document.getElementById('dashboard').style.display="block";
  loadMembers();
}
function logout(){ localStorage.removeItem('ironcity_admin'); location.reload(); }
if(localStorage.getItem('ironcity_admin') === 'true'){ showDashboard(); }

async function loadMembers(){
  document.getElementById('todayDate').innerText = new Date().toDateString().slice(4);
  document.getElementById('tableBody').innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";
  try{
    const res = await fetch(SCRIPT_URL+"?action=getMembers");
    const data = await res.json();
    let total=0, active=0, expired=0, soon=0, revenue=0, html="";
    data.reverse().forEach(m=>{
      if(!m.name) return;
      total++; revenue += parseInt(m.price||0);
      let cls="active"; let st=m.status||"🟢 Active";
      if(st.includes("Expired")){ expired++; cls="expired"; }
      else if(st.includes("Expires")){ soon++; cls="expiring"; }
      else { active++; }
      html += `<tr><td>${m.name}</td><td>${m.phone}</td><td>${m.plan}</td><td>${new Date(m.expiryDate).toDateString().slice(4)}</td><td class="${cls}">${st}</td></tr>`;
    });
    document.getElementById('tableBody').innerHTML = html || "<tr><td colspan='5'>No members yet</td></tr>";
    document.getElementById('total').innerText = total;
    document.getElementById('active').innerText = active;
    document.getElementById('expired').innerText = expired;
    document.getElementById('soon').innerText = soon;
    document.getElementById('revenue').innerText = "₦"+revenue.toLocaleString();
  }catch(e){
    document.getElementById('tableBody').innerHTML = "<tr><td colspan='5'>Error. Check Script URL</td></tr>";
  }
}
function filterTable(){
  const q=document.getElementById('search').value.toLowerCase();
  document.querySelectorAll('#tableBody tr').forEach(r=>{
    r.style.display = r.innerText.toLowerCase().includes(q)? "" : "none";
  });
}
</script>
</body>
</html>
